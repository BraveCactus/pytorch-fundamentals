[project]
name = "pytorch-fundamentals"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "gdown>=6.1.0",
    "ipykernel>=6.29.5",
    "jedi>=0.20.0",
    "matplotlib>=3.10.8",
    "numpy>=2.4.3",
    "pandas>=3.0.1",
    "plotly>=6.7.0",
    "pytorch-lightning>=2.6.5",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "tensorboard>=2.21.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "ruff>=0.1.0",
]
